databaseChangeLog:
  - changeSet:
      id: upload-customer-analysis-notebook-file
      author: amalik
      # See README.md "Change detection" - bump source-version whenever
      # files/customer_analysis.ipynb changes so this re-runs.
      runOnChange: true
      comment: Upload customer_analysis.ipynb to the notebook stage
      changes:
        - sql:
            sql: |
              /* source-version: 1 */
              PUT file://changesets/notebooks/files/customer_analysis.ipynb
                @NOTEBOOK_STAGE
                OVERWRITE = TRUE
                AUTO_COMPRESS = FALSE;
      rollback:
        - sql:
            sql: REMOVE @NOTEBOOK_STAGE/customer_analysis.ipynb;

  - changeSet:
      id: create-customer-analysis-notebook
      author: amalik
      comment: Create the Snowflake Notebook object pointed at the staged .ipynb
      changes:
        - sql:
            sql: |
              CREATE NOTEBOOK IF NOT EXISTS CUSTOMER_ANALYSIS
                FROM '@NOTEBOOK_STAGE'
                MAIN_FILE = 'customer_analysis.ipynb'
                QUERY_WAREHOUSE = 'SANDBOX_WH';
      rollback:
        - sql:
            sql: DROP NOTEBOOK IF EXISTS CUSTOMER_ANALYSIS;

  - changeSet:
      id: publish-customer-analysis-notebook-live-version
      author: amalik
      # runAlways because "ADD LIVE VERSION FROM LAST" is how Snowflake picks
      # up new staged file content into the notebook's live version - this
      # needs to fire every deploy after the PUT above, not just once.
      runAlways: true
      comment: Refresh the notebook's live version from the latest staged file
      changes:
        - sql:
            sql: ALTER NOTEBOOK CUSTOMER_ANALYSIS ADD LIVE VERSION FROM LAST;
      rollback: empty